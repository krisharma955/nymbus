<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090A0D; font-family:'Geist Mono', monospace, -apple-system, sans-serif;">
  <defs>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Drafting Grid Background -->
  <pattern id="gridPattern3" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161A22" stroke-width="0.8"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#gridPattern3)" opacity="0.6"/>

  <!-- APP SHELL HEADER -->
  <rect x="0" y="0" width="1200" height="48" fill="#0C0E14" stroke="#1C202A" stroke-width="1"/>
  <text x="24" y="30" fill="#F8FAFC" font-size="14" font-weight="800" letter-spacing="2">NYMBUS</text>
  <text x="100" y="30" fill="#64748B" font-size="11">// FORENSIC AUDIT STREAM</text>

  <!-- Live Swarm Heartbeat Pill -->
  <g transform="translate(480, 14)">
    <rect x="0" y="0" width="340" height="22" rx="2" fill="#13161E" stroke="#1C202A" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#D4A373" filter="url(#glow3)"/>
    <text x="24" y="15" fill="#F8FAFC" font-size="10">5 AGENTS LIVE · ELAPSED: 00:04:12 · TOKENS: 3.8K</text>
  </g>

  <!-- ================= LEFT SIDEBAR (CHRONOLOGICAL AUDIT TREE) ================= -->
  <rect x="0" y="48" width="260" height="627" fill="#0A0C11" stroke="#1C202A" stroke-width="1"/>
  
  <g transform="translate(16, 64)">
    <rect x="0" y="0" width="228" height="34" rx="2" fill="#13161E" stroke="#1C202A" stroke-width="1"/>
    <text x="14" y="22" fill="#F8FAFC" font-size="11" font-weight="700">+ NEW INQUEST SESSION</text>
  </g>

  <text x="18" y="130" fill="#64748B" font-size="9" font-weight="700" letter-spacing="1">CRYPTOGRAPHIC INQUEST TREE</text>

  <!-- Tree Item 1 (Active) -->
  <g transform="translate(16, 145)">
    <rect x="0" y="0" width="228" height="70" rx="2" fill="#151922" stroke="#D4A373" stroke-width="1"/>
    <circle cx="14" cy="22" r="3" fill="#D4A373"/>
    <text x="24" y="25" fill="#F8FAFC" font-size="11" font-weight="700">SPARC 20.1T Magnet Stress</text>
    <text x="12" y="44" fill="#64748B" font-size="9">SHA: 0a56b198...402846</text>
    <text x="12" y="60" fill="#D4A373" font-size="9" font-weight="600">3 subtasks · 98.4% Entailment</text>
  </g>

  <!-- Tree Item 2 -->
  <g transform="translate(16, 225)">
    <rect x="0" y="0" width="228" height="60" rx="2" fill="#0C0E14" stroke="#1C202A" stroke-width="1"/>
    <circle cx="14" cy="22" r="3" fill="#10B981"/>
    <text x="24" y="25" fill="#E2E8F0" font-size="11">Helium-3 Lunar Abundance</text>
    <text x="12" y="44" fill="#475569" font-size="9">SHA: e3b0c442...b855</text>
  </g>

  <!-- Tree Item 3 -->
  <g transform="translate(16, 295)">
    <rect x="0" y="0" width="228" height="60" rx="2" fill="#0C0E14" stroke="#1C202A" stroke-width="1"/>
    <circle cx="14" cy="22" r="3" fill="#EF4444"/>
    <text x="24" y="25" fill="#E2E8F0" font-size="11">Muon-Catalyzed Fusion Rates</text>
    <text x="12" y="44" fill="#475569" font-size="9">SHA: 7d1a293f...912a</text>
  </g>

  <!-- ================= MIDDLE UNIFIED FORENSIC STREAM ================= -->
  
  <g transform="translate(276, 64)">
    
    <!-- Step 1: Researcher Inquest -->
    <g transform="translate(0, 0)">
      <line x1="20" y1="20" x2="20" y2="450" stroke="#1C202A" stroke-width="2"/>
      <circle cx="20" cy="20" r="5" fill="#F8FAFC"/>
      
      <rect x="45" y="0" width="860" height="50" rx="2" fill="#0E1118" stroke="#1C202A" stroke-width="1"/>
      <text x="65" y="22" fill="#64748B" font-size="9" font-weight="700">RESEARCHER INQUEST // 15:20:10 UTC</text>
      <text x="65" y="38" fill="#F8FAFC" font-size="12" font-weight="600">Determine whether SPARC toroidal field coil stress tolerances remain below the 700 MPa yield strength limit during 20.1T excitation.</text>
    </g>

    <!-- Step 2: Integrated Subtask Progress Checklist (Ticks in real time) -->
    <g transform="translate(0, 65)">
      <circle cx="20" cy="20" r="5" fill="#D4A373" filter="url(#glow3)"/>
      
      <rect x="45" y="0" width="860" height="150" rx="2" fill="#121620" stroke="#D4A373" stroke-width="1"/>
      <rect x="45" y="0" width="860" height="28" fill="rgba(212,163,115,0.08)"/>
      <text x="65" y="19" fill="#D4A373" font-size="10" font-weight="800">AUTONOMOUS SUBTASK EXECUTION PIPELINE // ACTIVE TRACE</text>
      
      <!-- Subtask 1 -->
      <text x="65" y="52" fill="#10B981" font-size="11" font-weight="700">✓ [SUBTASK 01] OrchestratorAgent:</text>
      <text x="310" y="52" fill="#94A3B8" font-size="11">Decomposed inquiry into 3 verifiable sub-claims (120ms)</text>
      
      <!-- Subtask 2 -->
      <text x="65" y="80" fill="#10B981" font-size="11" font-weight="700">✓ [SUBTASK 02] ResearchAgent:</text>
      <text x="310" y="80" fill="#94A3B8" font-size="11">Retrieved Nature Energy 2025 paper &amp; isolated § 14.2 (840ms)</text>

      <!-- Subtask 3 (In-Flight) -->
      <circle cx="70" cy="110" r="4" fill="#D4A373" filter="url(#glow3)"/>
      <text x="82" y="113" fill="#D4A373" font-size="11" font-weight="800">⏳ [SUBTASK 03] VerificationAgent:</text>
      <text x="310" y="113" fill="#F8FAFC" font-size="11">Cross-referencing yield stress (610 MPa peak) against 700 MPa threshold... Entailment: 98.4%</text>

      <line x1="65" y1="130" x2="880" y2="130" stroke="#1C202A" stroke-width="1"/>
      <text x="65" y="142" fill="#64748B" font-size="9">EXECUTION TELEMETRY: 4 Tool calls · 1,420 prompt tokens · 0 retries required</text>
    </g>

    <!-- Step 3: Verified Findings Dossier -->
    <g transform="translate(0, 230)">
      <circle cx="20" cy="20" r="5" fill="#10B981"/>
      
      <rect x="45" y="0" width="860" height="210" rx="2" fill="#0C0E14" stroke="#1C202A" stroke-width="1"/>
      <rect x="45" y="0" width="860" height="28" fill="#12151D"/>
      <text x="65" y="19" fill="#10B981" font-size="10" font-weight="700">VERIFIED RESEARCH DOSSIER // CITATION COMMIT</text>
      <rect x="795" y="5" width="100" height="18" rx="2" fill="rgba(16,185,129,0.15)"/>
      <text x="805" y="18" fill="#10B981" font-size="9" font-weight="700">CONFIDENCE: 98.4%</text>

      <text x="65" y="55" fill="#F8FAFC" font-size="12" font-weight="500">
        Finite element mechanical analysis confirmed peak Von Mises stress inside the radial plates reached 612 MPa, safely below the 700 MPa yield threshold.
      </text>

      <!-- Clickable Citation Chip -->
      <rect x="65" y="75" width="165" height="22" rx="2" fill="#1A1F2C" stroke="#D4A373" stroke-width="1"/>
      <text x="75" y="90" fill="#D4A373" font-size="10" font-weight="700">[1] § 14.2 · NATURE ENERGY</text>

      <rect x="65" y="110" width="820" height="50" rx="2" fill="#090A0D" stroke="#1C202A" stroke-width="1"/>
      <text x="80" y="130" fill="#D4A373" font-size="10">"Peak structural stress under 20.1T nominal field was measured at 612 ± 15 MPa across all 18 coils."</text>
      <text x="80" y="148" fill="#64748B" font-size="9">Nature Energy (2025) · DOI: 10.1038/s41560-025-0142-9</text>

      <text x="65" y="185" fill="#64748B" font-size="9">SHA-256 Commit: 0a56b1986683477589c673a668765655c38cdab3ac9826354890282638402846</text>
    </g>
  </g>

  <!-- ================= FLOATING COMMAND DOCK ================= -->
  <g transform="translate(320, 560)">
    <rect x="0" y="0" width="860" height="95" rx="2" fill="#0C0E14" stroke="#D4A373" stroke-width="1"/>
    
    <text x="24" y="32" fill="#4B5563" font-size="12">Enter adversarial query or hypothesis to test against source corpus...</text>
    
    <g transform="translate(24, 60)">
      <text x="0" y="12" fill="#64748B" font-size="10">DEEP RESEARCH: ON</text>
      <text x="140" y="12" fill="#64748B" font-size="10">TEMP: 0.1 (DETERMINISTIC)</text>
      <text x="310" y="12" fill="#64748B" font-size="10">NLI ENTAILMENT: &gt;95%</text>
      
      <rect x="680" y="-8" width="144" height="30" rx="2" fill="#F8FAFC"/>
      <text x="705" y="12" fill="#090A0D" font-size="11" font-weight="800">EXECUTE INQUEST</text>
    </g>
  </g>
</svg>
