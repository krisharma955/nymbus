    <circle cx="220" cy="11" r="3" fill="#D4A373" filter="url(#glow1)"/>
    <text x="230" y="15" fill="#D4A373" font-size="10" font-weight="700">VERIFICATION</text>
    <text x="325" y="15" fill="#64748B" font-size="10">→</text>
