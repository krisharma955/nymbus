    <circle cx="26" cy="208" r="5" fill="#D4A373" filter="url(#glow1)"/>
    <text x="38" y="211" fill="#D4A373" font-size="10" font-weight="800">SUBTASK 03: ADVERSARIAL NLI GATE</text>
    <text x="38" y="227" fill="#E2E8F0" font-size="9">VerificationAgent · Entailment hypothesis check</text>
    <text x="38" y="243" fill="#94A3B8" font-size="9">Confidence: 98.4% (Threshold: 95.0%)</text>
    <rect x="290" y="200" width="64" height="16" rx="2" fill="#D4A373"/>
    <text x="296" y="212" fill="#090A0D" font-size="8" font-weight="800">ACTIVE</text>

    <line x1="26" y1="264" x2="26" y2="280" stroke="#334155" stroke-width="1"/>

    <rect x="12" y="280" width="354" height="54" rx="2" fill="#0E1015" stroke="#1C202A" stroke-width="1"/>
    <circle cx="26" cy="298" r="4" fill="#475569"/>
    <text x="38" y="301" fill="#64748B" font-size="10" font-weight="600">SUBTASK 04: DOSSIER COMPOSITION</text>
    <text x="38" y="317" fill="#475569" font-size="9">ReportAgent · Pending upstream verification</text>
    <text x="310" y="302" fill="#475569" font-size="8">WAITING</text>
