    <rect x="0" y="126" width="904" height="32" fill="rgba(212,163,115,0.08)"/>
    <text x="20" y="147" fill="#D4A373" font-size="11" font-weight="800">SYNTHESIZED SCIENTIFIC VERDICT · IMMUTABLE CITATION COMMIT</text>
    
    <text x="20" y="180" fill="#F8FAFC" font-size="12" font-weight="500">
      The SPARC toroidal field model coil sustained 20.1 Tesla central magnetic field with no quench degradation.
    </text>
    
    <!-- Inline Citation Badge -->
    <rect x="20" y="200" width="160" height="22" rx="2" fill="#1A1F2B" stroke="#D4A373" stroke-width="1"/>
    <text x="30" y="215" fill="#D4A373" font-size="10" font-weight="700">[1] § 14.2 · NATURE ENERGY</text>

    <text x="190" y="215" fill="#94A3B8" font-size="11">
