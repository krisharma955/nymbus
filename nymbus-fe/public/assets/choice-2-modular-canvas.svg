    </text>

    <rect x="20" y="235" width="864" height="54" rx="2" fill="#090A0D" stroke="#1C202A" stroke-width="1"/>
    <text x="36" y="255" fill="#D4A373" font-size="10" font-weight="600">"Central field exceeded 20.1 Tesla at operating current 18.5 kA under vacuum conditions."</text>
    <text x="36" y="275" fill="#64748B" font-size="9">Source: Nature Energy 2025 · Entailment: 98.4% · SHA-256 Digest Verified</text>
    
    <text x="20" y="325" fill="#64748B" font-size="9">AUDIT LOG: Bound to immutable dossier #492 by ReportAgent</text>
