      <circle cx="20" cy="20" r="4" fill="#D4A373" filter="url(#glow2)"/>
      <text x="35" y="16" fill="#D4A373" font-size="9" font-weight="800">SUBTASK 03 [ACTIVE]</text>
      <text x="35" y="26" fill="#F8FAFC" font-size="8">NLI Entailment Gate · 98.4%</text>
